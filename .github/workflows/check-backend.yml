name: Check backend (read-only)

# Talks to the Supabase project exactly like a signed-out visitor's browser does
# (public publishable key only, no secrets) and reports whether the back end is ready.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.js", ".github/workflows/check-backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" config.js)
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          fail=0
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "$1 → $2 ($3)"; }
          count() { curl -s -o /dev/null -D - "${H[@]}" -H "Prefer: count=exact" -H "Range: 0-0" "$URL/rest/v1/$1" | tr -d '\r' | awk -F/ '/^content-range/ {print $2}'; }
          echo "| Check | Result | Expected |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          s=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" "$URL/auth/v1/health"); row "Auth service" "HTTP $s" "200"; [ "$s" = 200 ] || fail=1
          for t in "species_index?select=id:32" "regions?select=code:41" "packs?select=id:4" "pack_prices?select=id:8" "checklist?select=species_id:596"; do
            path=${t%:*}; want=${t##*:}; got=$(count "$path"); row "${path%%\?*}" "${got:-error}" "$want"; [ -n "$got" ] && [ "$got" -ge "$want" ] 2>/dev/null || fail=1
          done
          got=$(curl -s "${H[@]}" "$URL/rest/v1/species?select=id" ); row "Paid species notes hidden from visitors (RLS)" "$got" "[]"; [ "$got" = "[]" ] || fail=1
          st=$(curl -s -X POST "${H[@]}" -H "Content-Type: application/json" -d '{}' "$URL/rest/v1/rpc/public_stats"); echo "$st" | grep -q '"totals"' && row "public_stats() for website report" "ok" "ok" || { row "public_stats()" "$(echo "$st" | head -c 120)" "ok"; fail=1; }
          bs=$(curl -s -X POST "${H[@]}" -H "Content-Type: application/json" -d '{}' "$URL/rest/v1/rpc/backend_status")
          if echo "$bs" | grep -q auth_users; then
            j() { echo "$bs" | python3 -c "import json,sys;print(json.load(sys.stdin)$1)"; }
            row "Accounts (auth / profiles)" "$(j "['auth_users']") / $(j "['profiles']")" "equal"
            m=$(j "['users_without_profile']"); row "Accounts missing a profile" "$m" "0"; [ "$m" = 0 ] || fail=1
            a=$(j "['admins']"); row "Admins" "$a" "≥ 1"; [ "$a" -ge 1 ] || echo "::warning title=No admin yet::Run: update public.profiles set role='admin' where email='you@…';"
            row "Unconfirmed e-mails" "$(j "['unconfirmed_emails']")" "info"
            row "Live-update tables (realtime)" "$(j "['realtime_tables']")" "checklist, pack_prices, species"
          else
            row "Accounts + live updates (accounts-live.sql)" "not installed" "installed"; fail=1
            echo "::error title=Run accounts-live.sql::Paste supabase/accounts-live.sql into Supabase → SQL Editor and Run."
          fi
          # ── sign-in / sign-up diagnostics (no account is created, no e-mail is sent) ──
          st=$(curl -s "${H[@]}" "$URL/auth/v1/settings"); echo "AUTH SETTINGS: $st"
          j2() { echo "$st" | python3 -c "import json,sys;d=json.load(sys.stdin);print($1)" 2>/dev/null; }
          row "E-mail sign-in enabled" "$(j2 "d.get('external',{}).get('email')")" "True"
          row "Sign-ups allowed" "$(j2 "not d.get('disable_signup')")" "True"
          row "E-mail confirmation required" "$(j2 "not d.get('mailer_autoconfirm')")" "info"
          row "Google sign-in enabled" "$(j2 "d.get('external',{}).get('google')")" "optional"
          code=$(curl -s -o /tmp/tok.json -w '%{http_code}' -X POST "${H[@]}" -H "Content-Type: application/json" -d '{"email":"nobody@example.invalid","password":"wrong-password-123"}' "$URL/auth/v1/token?grant_type=password")
          row "Password sign-in endpoint answers (bad login on purpose)" "HTTP $code $(head -c 120 /tmp/tok.json)" "400 invalid_credentials"
          code=$(curl -s -o /tmp/su.json -w '%{http_code}' -X POST "${H[@]}" -H "Content-Type: application/json" -d '{"email":"not-an-email","password":"x"}' "$URL/auth/v1/signup")
          row "Sign-up endpoint answers (invalid e-mail on purpose)" "HTTP $code $(head -c 120 /tmp/su.json)" "400/422 validation error"
          b=$(curl -s "${H[@]}" "$URL/storage/v1/bucket/photos" -o /dev/null -w '%{http_code}'); row "Photo storage bucket" "HTTP $b" "200/400 (exists)"
          for f in create-order razorpay-webhook; do c=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "${URL/.supabase.co/.functions.supabase.co}/$f"); row "Edge function $f" "HTTP $c" "deployed if not 404 (optional)"; done
          exit $fail
