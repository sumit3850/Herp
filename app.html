<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HerpWatch Field App</title>
<meta name="theme-color" content="#1f5b3c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:40;background:var(--forest);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] header.top{background:#12301f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#12301f}}
header.top .brand{font-family:var(--display);font-size:20px;line-height:1}
header.top select{width:auto;max-width:48vw;min-height:34px;padding:4px 8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:13px}
header.top select option{color:#000}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:#9ae6b4}.dot.off{background:#fbd38d}.dot.pending{background:#f6ad55}
main{max-width:760px;margin:0 auto;padding:14px 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--forest-2)}
.view{display:none}.view.on{display:block}
.search{position:relative;margin-bottom:10px}.search input{padding-left:36px}
.search::before{content:"⌕";position:absolute;left:12px;top:8px;font-size:18px;color:var(--muted)}
.splist{display:flex;flex-direction:column;gap:8px}
.sp{display:flex;gap:12px;align-items:center;padding:10px;text-align:left;width:100%}
.sp .th{width:64px;height:64px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--forest-soft)}
.sp .th img{width:100%;height:100%;object-fit:cover}
.sp .nm{font-weight:650;font-size:15px}
.sp .sci{font-style:italic;color:var(--ink-soft);font-size:13px}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-radius:18px 18px 0 0;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .x{position:sticky;top:0;float:right;font-size:22px;color:var(--ink-soft);padding:2px 8px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px 0;border-radius:12px}
.gallery img,.gallery .sil{flex:0 0 100%;height:230px;object-fit:cover;scroll-snap-align:start;border-radius:12px}
.kv{margin-top:12px}.kv h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:3px}
.kv p{font-size:14.5px}
.safety{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.safety.venom{background:var(--red-soft);color:var(--red)}
.locked{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:12px;background:var(--surface-2)}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:17px}.stat span{font-size:11px;color:var(--ink-soft)}
.cnt{display:flex;align-items:center;gap:4px;flex-shrink:0}
.cnt button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);font-size:20px;font-weight:600;background:var(--surface-2)}
.cnt .n{min-width:30px;text-align:center;font-family:var(--mono);font-weight:600}
.cnt .plus{background:var(--forest-2);color:#fff;border-color:var(--forest-2)}
.rec-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.rec-row.has{background:var(--forest-soft)}
#rkmap,#tripmap{height:260px;border-radius:12px;margin:10px 0;z-index:1}
.bigbtn{width:100%;padding:20px;border-radius:16px;font-size:18px;font-weight:700;background:var(--red);color:#fff;box-shadow:var(--shadow)}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.opt .e{font-size:32px}.opt.on{border-color:var(--forest-2);background:var(--forest-soft)}
.steps{display:flex;gap:4px;margin:6px 0 12px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--forest-2)}
.auth{max-width:420px;margin:24px auto}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs2 button{padding:8px;border-radius:9px;font-weight:600}.tabs2 button.on{background:var(--surface);box-shadow:var(--shadow)}
.price{font-family:var(--mono);font-weight:600}
.storeitem{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.storeitem input{width:22px;min-height:22px;height:22px;accent-color:var(--forest-2)}
.storeitem.owned{opacity:.6}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px}
</style>
</head>
<body>
<div id="demo" class="demo-banner hidden">Demo mode — data stays in this browser. Sign in as <b>field@demo / field</b> or <b>admin@demo / admin</b>.</div>
<header class="top">
  <span class="brand" id="brand">HerpWatch</span>
  <select id="region" aria-label="Region"></select>
  <span class="sync" id="sync"><span class="dot" id="syncdot"></span><span id="synctxt">online</span></span>
</header>

<main>
  <!-- AUTH -->
  <section class="view" id="v-auth">
    <div class="auth card pad">
      <h1 class="display" style="font-size:28px">Welcome</h1>
      <p class="muted small" id="tagline" style="margin-bottom:14px"></p>
      <div class="tabs2"><button id="t-in" class="on">Sign in</button><button id="t-up">Create account</button></div>
      <form id="f-in">
        <label class="f">Email or username</label><input id="in-email" autocomplete="username" required>
        <label class="f">Password</label><input id="in-pw" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary btn-block" style="margin-top:14px">Sign in</button>
        <button type="button" class="btn btn-ghost btn-block btn-sm" id="forgot" style="margin-top:8px">Forgot password?</button>
      </form>
      <form id="f-up" class="hidden">
        <label class="f">Full name</label><input id="up-name" required>
        <div class="grid2"><div><label class="f">Username</label><input id="up-user" required pattern="[a-z0-9_.\-]{3,30}" title="3–30 lowercase letters, digits, . _ -"></div>
        <div><label class="f">Phone (optional)</label><input id="up-phone" type="tel"></div></div>
        <label class="f">Email</label><input id="up-email" type="email" required>
        <label class="f">Home state / country</label><select id="up-region"></select>
        <label class="f">Password</label><input id="up-pw" type="password" minlength="6" required>
        <button class="btn btn-primary btn-block" style="margin-top:14px">Create account</button>
      </form>
    </div>
  </section>

  <!-- GUIDE -->
  <section class="view" id="v-guide">
    <div class="search"><input id="q" placeholder="Search common or scientific name" type="search"></div>
    <div class="chips" id="packchips"></div>
    <div class="chips" id="filterchips"></div>
    <p class="small muted" id="guidecount" style="margin:2px 0 8px"></p>
    <div class="splist" id="splist"></div>
  </section>

  <!-- IDENTIFY -->
  <section class="view" id="v-identify"><div id="idf"></div></section>

  <!-- RECORD (eBird-style checklist) -->
  <section class="view" id="v-record"><div id="rec"></div></section>

  <!-- ROAD-KILL -->
  <section class="view" id="v-roadkill"><div id="rk"></div></section>

  <!-- ME -->
  <section class="view" id="v-me"><div id="me"></div></section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="guide" class="on"><span class="i">📖</span>Guide</button>
  <button data-v="identify"><span class="i">🔍</span>Identify</button>
  <button data-v="record"><span class="i">📝</span>Record</button>
  <button data-v="roadkill"><span class="i">🛣️</span>Road-kill</button>
  <button data-v="me"><span class="i">👤</span>Me</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="x" id="sheetx" aria-label="Close">×</button><div id="sheetbody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="data/seed.js"></script>
<script src="common.js"></script>
<script>
'use strict';
const { api, IUCN, VENOM, TOXIC, util: U } = HW;
const $ = (id) => document.getElementById(id);
const esc = U.esc;

// ───────────────────────── state ─────────────────────────
const S = {
  me: null, packs: [], regions: [], prices: [], index: [], unlocked: {}, ents: [],
  region: U.lsGet('hw_region', HW.C.DEFAULT_REGION || 'IN'), checklist: [], pack: 'all', filters: new Set(), q: '',
  view: 'guide',
};
const byId = (id) => S.index.find((s) => s.id === id);
const packOf = (id) => S.packs.find((p) => p.id === id) || { name: id, emoji: '', color: '#2f7d4f' };
const regionName = (c) => S.regions.find((r) => r.code === c)?.name || c;
const isUnlocked = (id) => !!S.unlocked[id];

function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function openSheet(html) { $('sheetbody').innerHTML = html; $('sheet').classList.add('on'); $('scrim').classList.add('on'); $('sheet').scrollTop = 0; }
function closeSheet() { $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
$('scrim').onclick = closeSheet; $('sheetx').onclick = closeSheet;

function pills(s) {
  const iu = IUCN[s.iucn] || IUCN.NE;
  let h = `<span class="pill iucn" style="background:${iu.color}" title="${esc(iu.name)}">IUCN ${esc(s.iucn)}</span>`;
  if (s.pack === 'snakes' || s.venom !== 'non') h += `<span class="pill ${s.venom === 'venomous' ? 'venom' : s.venom === 'mild' ? 'mild' : 'safe'}">${VENOM[s.venom].icon} ${VENOM[s.venom].short}</span>`;
  if (s.toxic === 'poisonous') h += `<span class="pill poison">☠ Poisonous</span>`;
  if (s.endemic) h += `<span class="pill end">Endemic</span>`;
  if (!isUnlocked(s.id)) h += `<span class="pill lock">🔒 ${esc(packOf(s.pack).name)}</span>`;
  return h;
}
function thumb(s) {
  const full = S.unlocked[s.id], img = full?.images?.[0];
  const url = typeof img === 'string' ? img : img?.url;
  return url ? `<img src="${esc(url)}" alt="" loading="lazy">` : `<div class="sil">${U.silhouette(s.pack, packOf(s.pack).color)}</div>`;
}
const nameHtml = (s) => `${esc(s.common)} <span class="sci">(<i>${esc(s.sci)}</i>)</span>`;

// ───────────────────────── catalogue loading (cached for offline) ─────────────────────────
async function loadCatalog() {
  const cache = U.lsGet('hw_cat', null);
  if (cache) Object.assign(S, { packs: cache.packs, regions: cache.regions, prices: cache.prices, index: cache.index });
  try {
    const [packs, regions, prices, index] = await Promise.all([api.packs(), api.regions(), api.prices(), api.speciesIndex()]);
    Object.assign(S, { packs, regions, prices, index });
    U.lsSet('hw_cat', { packs, regions, prices, index });
  } catch (e) { if (!cache) toast('Offline and no cached catalogue yet'); }
}
async function loadUser() {
  S.unlocked = U.lsGet('hw_unlocked_' + (S.me?.id || ''), {});
  S.ents = U.lsGet('hw_ents_' + (S.me?.id || ''), []);
  if (!S.me) return;
  try {
    S.ents = await api.myEntitlements();
    const full = await api.unlockedSpecies();
    S.unlocked = Object.fromEntries(full.map((s) => [s.id, s]));   // whole unlocked pack cached → works offline in the field
    U.lsSet('hw_unlocked_' + S.me.id, S.unlocked); U.lsSet('hw_ents_' + S.me.id, S.ents);
  } catch (e) { console.warn(e); }
}
async function loadChecklist() {
  const key = 'hw_cl_' + S.region;
  S.checklist = U.lsGet(key, null) || S.index.filter((s) => (s.regions || []).includes(S.region)).map((s) => s.id);
  try { S.checklist = await api.checklist(S.region); U.lsSet(key, S.checklist); } catch {}
}
function fillRegionSelect(sel, value, { countryOnly = false } = {}) {
  const countries = S.regions.filter((r) => !r.parent), opts = [];
  for (const c of countries) {
    opts.push(`<option value="${c.code}" ${c.code === value ? 'selected' : ''}>${esc(c.name)}${countryOnly ? '' : ' (whole country)'}</option>`);
    if (!countryOnly) S.regions.filter((r) => r.parent === c.code).forEach((r) => opts.push(`<option value="${r.code}" ${r.code === value ? 'selected' : ''}>&nbsp;&nbsp;${esc(r.name)}</option>`));
  }
  sel.innerHTML = opts.join('');
}

// ───────────────────────── GPS (shared by checklist & road-kill) ─────────────────────────
const Geo = {
  wid: null, last: null, subs: new Set(), lock: null,
  start(fn) {
    if (fn) this.subs.add(fn);
    if (this.wid != null || !navigator.geolocation) return;
    this.wid = navigator.geolocation.watchPosition((p) => {
      this.last = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: p.timestamp, speed: p.coords.speed };
      this.subs.forEach((f) => f(this.last));
    }, (e) => toast('GPS: ' + e.message), { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
    this.wake();
  },
  stop(fn) {
    if (fn) this.subs.delete(fn);
    if (this.subs.size || this.wid == null) return;
    navigator.geolocation.clearWatch(this.wid); this.wid = null;
    this.lock?.release?.(); this.lock = null;
  },
  async wake() { try { this.lock = await navigator.wakeLock?.request('screen'); } catch {} },   // keep tracking while the screen is on
  once() {
    return new Promise((res) => {
      if (this.last && Date.now() - this.last.t < 30000) return res(this.last);
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: p.timestamp }), () => res(null), { enableHighAccuracy: true, timeout: 15000 });
    });
  },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Geo.wid != null) Geo.wake(); });
// accept a fix into a track only if accurate and actually moved (filters GPS jitter & jumps)
function pushTrack(track, f) {
  if (f.acc > 60) return false;
  const p = [+f.lat.toFixed(6), +f.lng.toFixed(6)], prev = track[track.length - 1];
  if (prev) { const d = U.haversineKm(prev, p) * 1000; if (d < 8 || d > 3000) return false; }
  track.push(p); return true;
}

// pre-select the state the phone is actually in (nearest centroid — a hint the user can change)
async function suggestRegion(selId) {
  const f = await Geo.once(); const sel = $(selId); if (!f || !sel) return;
  const r = U.nearestRegion(f.lat, f.lng);
  if (r && r !== sel.value && [...sel.options].some((o) => o.value === r)) { sel.value = r; toast('Region set from GPS: ' + regionName(r)); }
}

// ───────────────────────── outbox / sync (offline-first) ─────────────────────────
const outbox = () => U.lsGet('hw_outbox', []);
function queue(kind, payload) { const o = outbox().filter((x) => x.payload.id !== payload.id); o.push({ kind, payload }); U.lsSet('hw_outbox', o); return syncNow(); }
let syncing = false;
async function syncNow() {
  if (syncing || !S.me) return paintSync();
  syncing = true;
  let o = outbox();
  for (const item of [...o]) {
    if (!navigator.onLine) break;
    try {
      item.kind === 'trip' ? await api.saveTrip(item.payload) : await api.saveRoadkill(item.payload);
      o = o.filter((x) => x !== item); U.lsSet('hw_outbox', o);
    } catch (e) { console.warn('sync failed', e); toast('Sync failed: ' + e.message); break; }
  }
  syncing = false; paintSync();
}
function paintSync() {
  const n = outbox().length, on = navigator.onLine;
  $('syncdot').className = 'dot ' + (!on ? 'off' : n ? 'pending' : '');
  $('synctxt').textContent = !on ? `offline${n ? ' · ' + n + ' queued' : ''}` : n ? `${n} to sync` : HW.DEMO ? 'demo' : 'synced';
}
addEventListener('online', syncNow); addEventListener('offline', paintSync);

// ───────────────────────── navigation ─────────────────────────
function show(v) {
  S.view = v;
  document.querySelectorAll('.view').forEach((x) => x.classList.toggle('on', x.id === 'v-' + v));
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  $('tabs').classList.toggle('hidden', v === 'auth');
  ({ guide: renderGuide, identify: renderIdentify, record: renderRecord, roadkill: renderRoadkill, me: renderMe })[v]?.();
  scrollTo(0, 0);
}
$('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.v); };
$('region').onchange = async (e) => { S.region = e.target.value; U.lsSet('hw_region', S.region); await loadChecklist(); show(S.view); };

// ═════════════════════════ GUIDE ═════════════════════════
const FILTERS = [['venomous', '⚠ Venomous'], ['poisonous', '☠ Poisonous'], ['threatened', 'Threatened (CR/EN/VU)'], ['endemic', 'Endemic'], ['unlocked', 'Unlocked']];
function guideList() {
  const cl = new Set(S.checklist), q = S.q.trim().toLowerCase(), f = S.filters;
  return S.index.filter((s) => cl.has(s.id)
    && (S.pack === 'all' || s.pack === S.pack)
    && (!q || s.common.toLowerCase().includes(q) || s.sci.toLowerCase().includes(q) || (s.family || '').toLowerCase().includes(q))
    && (!f.has('venomous') || s.venom === 'venomous') && (!f.has('poisonous') || s.toxic === 'poisonous')
    && (!f.has('threatened') || ['CR', 'EN', 'VU'].includes(s.iucn)) && (!f.has('endemic') || s.endemic)
    && (!f.has('unlocked') || isUnlocked(s.id)))
    .sort((a, b) => S.packs.findIndex((p) => p.id === a.pack) - S.packs.findIndex((p) => p.id === b.pack) || a.common.localeCompare(b.common));
}
function renderGuide() {
  $('packchips').innerHTML = [['all', 'All groups'], ...S.packs.map((p) => [p.id, p.emoji + ' ' + p.name])]
    .map(([id, l]) => `<button class="chip ${S.pack === id ? 'on' : ''}" data-p="${id}">${esc(l)}</button>`).join('');
  $('filterchips').innerHTML = FILTERS.map(([id, l]) => `<button class="chip ${S.filters.has(id) ? 'on' : ''}" data-f="${id}">${esc(l)}</button>`).join('');
  const list = guideList();
  $('guidecount').textContent = `${list.length} species · checklist for ${regionName(S.region)}`;
  $('splist').innerHTML = list.length ? list.map((s) => `<button class="card sp" data-id="${s.id}"><div class="th">${thumb(s)}</div><div class="grow"><div class="nm">${esc(s.common)}</div><div class="sci"><i>${esc(s.sci)}</i> · ${esc(s.family)}</div><div class="pills">${pills(s)}</div></div></button>`).join('')
    : `<div class="empty">No species match. ${S.checklist.length ? 'Try clearing filters.' : 'No checklist has been published for this region yet.'}</div>`;
}
$('packchips').onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) { S.pack = b.dataset.p; renderGuide(); } };
$('filterchips').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { S.filters.has(b.dataset.f) ? S.filters.delete(b.dataset.f) : S.filters.add(b.dataset.f); renderGuide(); } };
$('q').oninput = (e) => { S.q = e.target.value; renderGuide(); };
$('splist').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) openSpecies(b.dataset.id); };

function unlockOffer(pack) {
  const isState = S.region.includes('-'), country = S.region.split('-')[0];
  const opts = [];
  try { if (isState) opts.push({ region: S.region, ...U.quoteFrom(S.prices, [{ pack, region: S.region }]) }); } catch {}
  try { opts.push({ region: country, ...U.quoteFrom(S.prices, [{ pack, region: country }]) }); } catch {}
  return `<div class="locked"><b>🔒 Unlock the ${esc(packOf(pack).name)} pack</b>
    <p class="small muted" style="margin:4px 0 10px">Photos, identification notes, habitat, distribution and the Identify wizard for every species in the pack. Safety info (venomous / poisonous) is always free.</p>

// ═════════════════════════ STORE (pick only the packs you want) ═════════════════════════
function openStore(region = S.region, preselect = []) {
  if (!S.me) return show('auth');
  const owned = (pack, reg) => S.ents.some((e) => e.pack === pack && (e.region === reg || e.region === reg.split('-')[0]));
  const render = (reg, picked) => {
    const lines = S.packs.map((p) => { let q = null; try { q = U.quoteFrom(S.prices, [{ pack: p.id, region: reg }]); } catch {} return { p, q, own: owned(p.id, reg) }; });
    const total = lines.filter((l) => picked.has(l.p.id) && l.q && !l.own).reduce((s, l) => s + l.q.total, 0);
    openSheet(`<h2>Choose your packs</h2><p class="small muted" style="margin:4px 0 10px">Pay only for the groups you need. A state pack covers that state's checklist; the country pack covers all of it.</p>
      <label class="f">Region</label><select id="st-reg"></select>
      <div style="margin-top:12px">${lines.map(({ p, q, own }) => `<label class="storeitem ${own ? 'owned' : ''}"><input type="checkbox" data-sp="${p.id}" ${picked.has(p.id) && !own ? 'checked' : ''} ${own || !q ? 'disabled' : ''}>
        <span style="font-size:26px">${p.emoji}</span><span class="grow"><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.blurb)}</span></span>
        <span class="price">${own ? 'Owned' : q ? U.rupees(q.total) : '—'}</span></label>`).join('')}</div>
      <div class="row" style="margin-top:10px"><b class="grow">Total <span class="price">${U.rupees(total)}</span> <span class="small muted">/ 1 year</span></b>
      <button class="btn btn-primary" id="st-pay" ${total ? '' : 'disabled'}>${HW.DEMO ? 'Unlock (demo, free)' : 'Pay with Razorpay'}</button></div>
      <p class="tiny muted" style="margin-top:8px">Payments are processed by Razorpay (UPI, cards, net-banking). Access is granted by our server once payment is confirmed.</p>`);
    fillRegionSelect($('st-reg'), reg);
    $('st-reg').onchange = (e) => render(e.target.value, picked);
    $('sheetbody').querySelectorAll('[data-sp]').forEach((c) => (c.onchange = () => { c.checked ? picked.add(c.dataset.sp) : picked.delete(c.dataset.sp); render(reg, picked); }));
    $('st-pay').onclick = async () => {
      const items = [...picked].filter((p) => !owned(p, reg)).map((pack) => ({ pack, region: reg }));
      $('st-pay').disabled = true; $('st-pay').textContent = 'Processing…';
      try { await api.checkout(items); await loadUser(); closeSheet(); toast('Unlocked! Packs are now available offline.'); show(S.view); }
      catch (e) { toast(e.message); render(reg, picked); }
    };
  };
  render(region, new Set(preselect));
}

// ═════════════════════════ IDENTIFY (Merlin-style step-by-step) ═════════════════════════
const COLORS = ['black', 'brown', 'tan', 'grey', 'olive', 'green', 'yellow', 'orange', 'red', 'blue', 'purple', 'pink', 'white'];
const PATTERNS = { plain: 'Plain / uniform', banded: 'Bands or rings', spotted: 'Spots', blotched: 'Large blotches', striped: 'Stripes (lengthwise)', zigzag: 'Zig-zag', checkered: 'Checkered', warty: 'Warty skin', star: 'Star-patterned shell' };
const TIMES = { day: '☀ Day', dusk: '🌆 Dusk / dawn', night: '🌙 Night' };
const IDF = { step: 0, pack: null, colors: new Set(), pattern: null, time: null };
function renderIdentify() {
  const el = $('idf'), st = IDF.step;
  const bar = `<div class="steps">${[0, 1, 2, 3, 4].map((i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>`;
  const nav = (next = true) => `<div class="row" style="margin-top:16px">${st ? '<button class="btn btn-ghost" id="i-back">Back</button>' : ''}<span class="grow"></span>${next ? '<button class="btn btn-primary" id="i-next">Next</button>' : ''}</div>`;
  if (st === 0) {
    el.innerHTML = `${bar}<h2>What did you see?</h2><p class="small muted">Answer a few questions — we’ll list the most likely species in ${esc(regionName(S.region))}.</p>
      <div class="grid2" style="margin-top:12px">${S.packs.map((p) => `<button class="opt ${IDF.pack === p.id ? 'on' : ''}" data-ip="${p.id}"><span class="e">${p.emoji}</span>${esc(p.name)}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ip]').forEach((b) => (b.onclick = () => { IDF.pack = b.dataset.ip; IDF.step = 1; renderIdentify(); }));
    return;
  }
  const cl = new Set(S.checklist);
  const inPack = S.index.filter((s) => s.pack === IDF.pack && cl.has(s.id));
  const pool = inPack.filter((s) => isUnlocked(s.id)).map((s) => ({ ...s, traits: S.unlocked[s.id].traits || {} }));
  if (!pool.length) {
    el.innerHTML = `${bar}<h2>${esc(packOf(IDF.pack).emoji + ' ' + packOf(IDF.pack).name)}</h2>
      <p class="muted small">${inPack.length} species on the ${esc(regionName(S.region))} checklist.</p>${unlockOffer(IDF.pack)}${nav(false)}`;
  } else if (st === 1) {
    const avail = new Set(pool.flatMap((s) => s.traits.color || []));
    el.innerHTML = `${bar}<h2>Main colours?</h2><p class="small muted">Pick all that apply (or skip).</p>
      <div class="chips wrap" style="flex-wrap:wrap;margin-top:10px">${COLORS.filter((c) => avail.has(c)).map((c) => `<button class="chip ${IDF.colors.has(c) ? 'on' : ''}" data-c="${c}">${c}</button>`).join('')}</div>${nav()}`;
    el.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { IDF.colors.has(b.dataset.c) ? IDF.colors.delete(b.dataset.c) : IDF.colors.add(b.dataset.c); renderIdentify(); }));
  } else if (st === 2) {
    const avail = new Set(pool.map((s) => s.traits.pattern));
    el.innerHTML = `${bar}<h2>Pattern?</h2><div class="grid2" style="margin-top:10px">${Object.entries(PATTERNS).filter(([k]) => avail.has(k)).map(([k, l]) => `<button class="opt ${IDF.pattern === k ? 'on' : ''}" data-pt="${k}">${esc(l)}</button>`).join('')}</div>${nav()}`;
    el.querySelectorAll('[data-pt]').forEach((b) => (b.onclick = () => { IDF.pattern = IDF.pattern === b.dataset.pt ? null : b.dataset.pt; renderIdentify(); }));
  } else if (st === 3) {
    el.innerHTML = `${bar}<h2>When did you see it?</h2><div class="grid2" style="margin-top:10px">${Object.entries(TIMES).map(([k, l]) => `<button class="opt ${IDF.time === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}</div>${nav()}`;
    el.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { IDF.time = IDF.time === b.dataset.t ? null : b.dataset.t; renderIdentify(); }));
  } else {
    const scored = pool.map((s) => {
      const t = s.traits; let sc = 0;
      IDF.colors.forEach((c) => { if ((t.color || []).includes(c)) sc += 2; });
      if (IDF.pattern && t.pattern === IDF.pattern) sc += 3;
      if (IDF.time && (t.time === IDF.time || t.time === 'any' || (IDF.time === 'dusk' && t.time === 'night'))) sc += 1;
      return { s, sc };
    }).sort((a, b) => b.sc - a.sc);
    const max = Math.max(1, IDF.colors.size * 2 + (IDF.pattern ? 3 : 0) + (IDF.time ? 1 : 0));
    el.innerHTML = `${bar}<h2>Most likely matches</h2><p class="small muted">Ranked by your answers. Always confirm with the ID notes — never handle a snake to identify it.</p>
      <div class="splist" style="margin-top:10px">${scored.slice(0, 8).map(({ s, sc }) => `<button class="card sp" data-id="${s.id}"><div class="th">${thumb(s)}</div><div class="grow"><div class="nm">${esc(s.common)}</div><div class="sci"><i>${esc(s.sci)}</i></div><div class="pills">${pills(s)}<span class="pill lock">${Math.round((sc / max) * 100)}% match</span></div></div></button>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-ghost" id="i-back">Back</button><span class="grow"></span><button class="btn btn-ghost" id="i-reset">Start over</button></div>`;
    el.querySelector('.splist').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) openSpecies(b.dataset.id); };
    $('i-reset').onclick = () => { Object.assign(IDF, { step: 0, pack: null, colors: new Set(), pattern: null, time: null }); renderIdentify(); };
  }
  $('i-back') && ($('i-back').onclick = () => { IDF.step--; renderIdentify(); });
  $('i-next') && ($('i-next').onclick = () => { IDF.step++; renderIdentify(); });
}

// ═════════════════════════ RECORD — eBird-style checklist ═════════════════════════
const TRIP = () => U.lsGet('hw_trip', null);
const saveTripState = (t) => U.lsSet('hw_trip', t);
const PROTOCOLS = { incidental: 'Incidental (no effort)', stationary: 'Stationary point count', traveling: 'Traveling transect', night_walk: 'Night walk / VES', area: 'Area search' };
let tripTimer = null, recFilter = '';
function onTripFix(f) { const t = TRIP(); if (!t) return; if (t.protocol !== 'stationary' && pushTrack(t.track, f)) saveTripState(t); paintTripStats(); }

function renderRecord() {
  const t = TRIP(), el = $('rec');
  clearInterval(tripTimer);
  if (!S.me) return show('auth');
  if (!t) {
    el.innerHTML = `<div class="card pad"><div class="eyebrow">New checklist</div><h2 style="margin:2px 0 8px">Start recording</h2>
      <label class="f">Protocol</label><select id="r-proto">${Object.entries(PROTOCOLS).map(([k, l]) => `<option value="${k}" ${k === 'traveling' ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <div class="grid2"><div><label class="f">Observers</label><input id="r-obs" type="number" min="1" value="1"></div>
      <div><label class="f">Region</label><select id="r-reg"></select></div></div>
      <button class="btn btn-primary btn-block" id="r-start" style="margin-top:14px">▶ Start checklist</button>
      <p class="tiny muted" style="margin-top:8px">The timer, GPS track and distance are recorded automatically. Works offline — it syncs when you’re back online.</p></div>
      <h3 style="margin:18px 0 8px">My recent checklists</h3><div id="r-hist" class="small muted">Loading…</div>`;
    fillRegionSelect($('r-reg'), S.region); suggestRegion('r-reg');
    $('r-start').onclick = async () => {
      const proto = $('r-proto').value, t = { id: U.uid(), protocol: proto, observers: +$('r-obs').value || 1, region_code: $('r-reg').value, started_at: new Date().toISOString(), track: [], items: {}, notes: '' };
      saveTripState(t);
      if (proto !== 'incidental') Geo.start(onTripFix);
      const f = await Geo.once(); if (f) { const t2 = TRIP(); t2.lat = f.lat; t2.lng = f.lng; if (proto !== 'stationary') pushTrack(t2.track, f); saveTripState(t2); }
      renderRecord();
    };
    loadHistory('r-hist');
    return;
  }
  if (t.protocol !== 'incidental') Geo.start(onTripFix);
  const cl = new Set(U.lsGet('hw_cl_' + t.region_code, null) || S.checklist);
  const list = S.index.filter((s) => cl.has(s.id) && (!recFilter || (s.common + ' ' + s.sci).toLowerCase().includes(recFilter.toLowerCase())));
  const extras = Object.values(t.items).filter((x) => !x.species_id);
  el.innerHTML = `<div class="card pad">
      <div class="row"><div class="grow"><div class="eyebrow">${esc(PROTOCOLS[t.protocol])}</div><b>${esc(regionName(t.region_code))}</b></div>
      <button class="btn btn-ghost btn-sm" id="r-map">Map</button></div>
      <div class="statbar"><div class="stat"><b id="ts-time">0:00</b><span>time</span></div><div class="stat"><b id="ts-km">0.00</b><span>km</span></div>
      <div class="stat"><b id="ts-sp">0</b><span>species</span></div><div class="stat"><b id="ts-gps">—</b><span>GPS ±m</span></div></div>
      <div class="search" style="margin:0"><input id="r-q" type="search" placeholder="Filter checklist…" value="${esc(recFilter)}"></div></div>
    <div class="card" style="margin-top:10px;overflow:hidden">
      ${extras.map((x) => recRow(x.key, `${esc(x.species_text)} <span class="small muted">(${esc(packOf(x.pack).name)}, unlisted)</span>`, x.count)).join('')}
      ${list.map((s) => recRow(s.id, `${nameHtml(s)}${s.venom === 'venomous' ? ' <span class="pill venom">⚠</span>' : ''}`, t.items[s.id]?.count || 0)).join('') || '<div class="empty">No species in this checklist.</div>'}
      <div class="pad"><button class="btn btn-ghost btn-block" id="r-other">+ Add unlisted / unidentified</button></div></div>
    <label class="f">Checklist notes</label><textarea id="r-notes" placeholder="Weather, habitat, observers…">${esc(t.notes || '')}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn btn-ghost" id="r-discard">Discard</button><span class="grow"></span><button class="btn btn-primary" id="r-submit">Submit checklist</button></div>`;
  paintTripStats(); tripTimer = setInterval(paintTripStats, 1000);
  $('r-q').oninput = (e) => { recFilter = e.target.value; const pos = e.target.selectionStart; renderRecord(); const q = $('r-q'); q.focus(); q.setSelectionRange(pos, pos); };
  $('r-notes').onchange = (e) => { const t = TRIP(); t.notes = e.target.value; saveTripState(t); };
  $('r-other').onclick = () => otherSheet();
  $('r-map').onclick = () => { const t = TRIP(); openSheet('<h3>Checklist track</h3><div id="tripmap"></div>'); setTimeout(() => drawMap('tripmap', t.track, Object.values(t.items).filter((x) => x.lat).map((x) => ({ lat: x.lat, lng: x.lng, label: x.species_text || byId(x.species_id)?.common }))), 260); };
  $('r-discard').onclick = () => { if (confirm('Discard this checklist? Nothing will be saved.')) { localStorage.removeItem('hw_trip'); Geo.stop(onTripFix); renderRecord(); } };
  $('r-submit').onclick = submitTrip;
  el.querySelectorAll('[data-inc]').forEach((b) => (b.onclick = () => bump(b.dataset.inc, +b.dataset.d)));
  el.querySelectorAll('[data-det]').forEach((b) => (b.onclick = () => detailSheet(b.dataset.det)));
}
const recRow = (key, label, n) => `<div class="rec-row ${n ? 'has' : ''}"><button class="grow" style="text-align:left" data-det="${esc(key)}">${label}</button>
  <span class="cnt"><button data-inc="${esc(key)}" data-d="-1" aria-label="minus">−</button><span class="n">${n || ''}</span><button class="plus" data-inc="${esc(key)}" data-d="1" aria-label="plus">+</button></span></div>`;
function paintTripStats() {
  const t = TRIP(); if (!t || !$('ts-time')) return;
  const sec = Math.floor((Date.now() - new Date(t.started_at)) / 1000);
  $('ts-time').textContent = `${Math.floor(sec / 3600) ? Math.floor(sec / 3600) + ':' : ''}${String(Math.floor(sec / 60) % 60).padStart(Math.floor(sec / 3600) ? 2 : 1, '0')}:${String(sec % 60).padStart(2, '0')}`;
  $('ts-km').textContent = U.trackKm(t.track).toFixed(2);
  $('ts-sp').textContent = Object.values(t.items).filter((x) => x.count > 0).length;
  $('ts-gps').textContent = Geo.last ? Math.round(Geo.last.acc) : '—';
}
function newItem(key, extra = {}) {
  const f = Geo.last;
  return { key, id: U.uid(), species_id: byId(key) ? key : null, species_text: '', count: 0, observed_at: new Date().toISOString(), lat: f?.lat ?? null, lng: f?.lng ?? null, accuracy_m: f?.acc ?? null, life_stage: '', sex: '', notes: '', photos: [], ...extra };
}
function bump(key, d) {
  const t = TRIP(); const it = t.items[key] || newItem(key);
  it.count = Math.max(0, it.count + d);
  if (it.count === 0 && it.species_id && !it.notes && !it.photos.length) delete t.items[key]; else t.items[key] = it;
  saveTripState(t); renderRecord();
}
function detailSheet(key, after) {
  const t = TRIP(); const it = t.items[key] || newItem(key, { count: 1 }); const s = byId(key);
  openSheet(`<h3>${s ? nameHtml(s) : esc(it.species_text)}</h3>

    <div><label class="f">Life stage</label><select id="d-ls">${['', 'adult', 'juvenile', 'hatchling', 'subadult', 'egg / clutch', 'tadpole', 'metamorph', 'shed skin'].map((v) => `<option ${v === it.life_stage ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>

    <p class="small muted" style="margin-top:8px">📍 ${it.lat != null ? `${it.lat.toFixed(5)}, ${it.lng.toFixed(5)} (±${Math.round(it.accuracy_m || 0)} m)` : 'no location yet'} <button class="btn btn-ghost btn-sm" id="d-pin">Use current location</button></p>

  $('d-pin').onclick = async () => { const f = await Geo.once(); if (!f) return toast('No GPS fix'); Object.assign(it, { lat: f.lat, lng: f.lng, accuracy_m: f.acc }); toast('Location updated'); };
  $('d-ph').onchange = async (e) => {
    for (const file of e.target.files) { try { it.photos.push(await U.processPhoto(file)); } catch (er) { toast('Photo failed: ' + er.message); } }
    $('d-thumbs').innerHTML = it.photos.map((p) => `<img src="${esc(p)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px">`).join('');

    Object.assign(it, { count: Math.max(0, +$('d-n').value || 0), life_stage: $('d-ls').value, sex: $('d-sex').value, notes: $('d-notes').value });
    const t2 = TRIP(); t2.items[key] = it; saveTripState(t2); closeSheet(); (after || renderRecord)();
  };
}
function otherSheet() {
  openSheet(`<h3>Unlisted or unidentified</h3>
    <label class="f">Group</label><select id="o-pack">${S.packs.map((p) => `<option value="${p.id}">${p.emoji} ${esc(p.name)}</option>`).join('')}</select>

function tripPayload(t) {
  const end = new Date();
  return {
    id: t.id, region_code: t.region_code, protocol: t.protocol, started_at: t.started_at, ended_at: end.toISOString(),
    duration_min: Math.round((end - new Date(t.started_at)) / 60000), distance_km: +U.trackKm(t.track).toFixed(2),
    observers: t.observers, complete: !!t.complete, track: t.track, lat: t.lat ?? null, lng: t.lng ?? null, notes: t.notes || '',
    sightings: Object.values(t.items).filter((x) => x.count > 0).map(({ key, pack, ...x }) => ({ ...x, region_code: t.region_code })),
  };
}
async function submitTrip() {
  const t = TRIP(); const n = Object.values(t.items).filter((x) => x.count > 0).length;
  if (!n && !confirm('No species recorded. Submit an empty checklist?')) return;
  t.complete = t.protocol !== 'incidental' && confirm('Are you reporting ALL species you could detect and identify?\n\nOK = complete checklist · Cancel = only some species');
  localStorage.removeItem('hw_trip'); Geo.stop(onTripFix); recFilter = '';
  await queue('trip', tripPayload(t));
  toast(`Checklist saved — ${n} species`); renderRecord();
}
// one-tap incidental sighting from the guide
async function quickSighting(id) {
  if (!S.me) return show('auth');
  if (TRIP()) { show('record'); bump(id, 1); return toast('Added to your open checklist'); }
  const f = await Geo.once();
  const t = { id: U.uid(), protocol: 'incidental', observers: 1, region_code: S.region, started_at: new Date().toISOString(), track: [], items: {}, notes: '', lat: f?.lat, lng: f?.lng };
  saveTripState(t); show('record'); detailSheet(id, () => { const t2 = TRIP(); queue('trip', tripPayload(t2)); localStorage.removeItem('hw_trip'); toast('Sighting saved'); renderRecord(); });
}
async function loadHistory(elId) {
  const el = $(elId); if (!el) return;
  const pend = outbox();
  let trips = [], surveys = [];
  try { [trips, surveys] = await Promise.all([api.myTrips(), api.mySurveys()]); } catch { el.innerHTML = 'Offline — history shows when you reconnect.'; }
  const isRk = elId === 'k-hist';
  const rows = isRk ? surveys.map((s) => `<div class="card pad" style="margin-bottom:8px"><b>${esc(s.road_name || 'Survey')}</b> <span class="small muted">${new Date(s.started_at).toLocaleString()}</span><div class="small">${s.distance_km} km · ${(s.records || []).length} records · ${esc(regionName(s.region_code))}</div></div>`)
    : trips.map((t) => `<div class="card pad" style="margin-bottom:8px"><b>${esc(PROTOCOLS[t.protocol] || t.protocol)}</b> <span class="small muted">${new Date(t.started_at).toLocaleString()}</span><div class="small">${(t.sightings || []).length} species · ${t.duration_min ?? 0} min · ${t.distance_km ?? 0} km · ${esc(regionName(t.region_code))}${t.complete ? ' · complete' : ''}</div></div>`);
  const queued = pend.filter((p) => p.kind === (isRk ? 'survey' : 'trip')).length;
  el.innerHTML = (queued ? `<p class="small" style="margin-bottom:8px">⏳ ${queued} waiting to sync</p>` : '') + (rows.join('') || '<div class="empty">Nothing yet.</div>');
}

// ═════════════════════════ ROAD-KILL LOGGER (track + points) ═════════════════════════
const RK = () => U.lsGet('hw_rk', null);
const saveRk = (r) => U.lsSet('hw_rk', r);
let rkMap = null, rkLine = null, rkLayer = null, rkMe = null, rkTimer = null;
function onRkFix(f) {
  const r = RK(); if (!r) return;
  if (pushTrack(r.track, f)) saveRk(r);
  if (rkMap) { rkLine.setLatLngs(r.track); rkMe.setLatLng([f.lat, f.lng]); if (!rkMap.hwUserPanned) rkMap.setView([f.lat, f.lng], Math.max(rkMap.getZoom(), 15)); }
  paintRkStats();
}
function drawMap(elId, track, pts, fit = true) {
  if (!window.L) { const el = $(elId); if (el) el.innerHTML = '<div class="empty small">Map unavailable offline — GPS track is still being recorded.</div>'; return {}; }
  const m = L.map(elId, { zoomControl: true, attributionControl: true });
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });
  L.control.layers({ Map: osm, Satellite: sat }).addTo(m);
  const line = L.polyline(track || [], { color: '#2f7d4f', weight: 4 }).addTo(m);
  const layer = L.layerGroup().addTo(m);
  (pts || []).forEach((p) => L.circleMarker([p.lat, p.lng], { radius: 7, color: '#fff', weight: 2, fillColor: p.color || '#c53030', fillOpacity: 1 }).bindPopup(esc(p.label || '')).addTo(layer));
  const all = [...(track || []), ...(pts || []).map((p) => [p.lat, p.lng])];
  if (fit && all.length > 1) m.fitBounds(all, { padding: [20, 20] }); else if (all.length) m.setView(all[0], 15); else m.setView(HW.CENTROIDS[S.region] || [20, 79], 7);
  return { m, line, layer };
}
function renderRoadkill() {
  const el = $('rk'), r = RK();
  clearInterval(rkTimer); if (rkMap) { rkMap.remove(); rkMap = null; }
  if (!S.me) return show('auth');
  if (!r) {
    el.innerHTML = `<div class="card pad"><div class="eyebrow">Road-kill data logger</div><h2 style="margin:2px 0 4px">Start a road survey</h2>
      <p class="small muted">Drive, ride or walk a road. The app records your GPS track (survey effort) and you drop a point for every road-killed animal. Results are reported as kills per 100 km.</p>
      <div class="grid2"><div><label class="f">Travel mode</label><select id="k-mode"><option value="car">Car</option><option value="motorbike">Motorbike</option><option value="bicycle">Bicycle</option><option value="walk">On foot</option><option value="other">Other</option></select></div>
      <div><label class="f">Road type</label><select id="k-type"><option>highway</option><option>state road</option><option>district road</option><option>village road</option><option>forest road</option><option>unpaved track</option></select></div></div>
      <label class="f">Road name / number</label><input id="k-road" placeholder="e.g. NH 4 Andaman Trunk Road">
      <label class="f">Region</label><select id="k-reg"></select>
      <button class="btn btn-red btn-block" id="k-start" style="margin-top:14px">▶ Start survey & track</button>
      <p class="tiny muted" style="margin-top:8px">Keep the screen on while driving (the app requests a wake-lock). For screen-off background tracking use the installed Android app. Never use the phone while driving — have a passenger log records.</p></div>
      <h3 style="margin:18px 0 8px">My road surveys</h3><div id="k-hist" class="small muted">Loading…</div>`;
    fillRegionSelect($('k-reg'), S.region); suggestRegion('k-reg');
    $('k-start').onclick = () => {
      saveRk({ id: U.uid(), mode: $('k-mode').value, road_type: $('k-type').value, road_name: $('k-road').value.trim(), region_code: $('k-reg').value, started_at: new Date().toISOString(), track: [], records: [], notes: '' });
      Geo.start(onRkFix); renderRoadkill();
    };
    loadHistory('k-hist');
    return;
  }
  Geo.start(onRkFix);
  el.innerHTML = `<div class="card pad"><div class="row"><div class="grow"><div class="eyebrow">Survey in progress · ${esc(r.mode)}</div><b>${esc(r.road_name || 'Unnamed road')}</b> <span class="small muted">${esc(regionName(r.region_code))}</span></div></div>
      <div class="statbar"><div class="stat"><b id="ks-time">0:00</b><span>time</span></div><div class="stat"><b id="ks-km">0.00</b><span>km</span></div><div class="stat"><b id="ks-n">0</b><span>records</span></div><div class="stat"><b id="ks-rate">0</b><span>/100 km</span></div></div>
      <div id="rkmap"></div>
      <button class="bigbtn" id="k-log">＋ Road-kill here</button></div>
    <div class="card" style="margin-top:10px" id="k-list"></div>
    <label class="f">Survey notes</label><textarea id="k-notes" placeholder="Traffic, weather, verge habitat…">${esc(r.notes)}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn btn-ghost" id="k-discard">Discard</button><span class="grow"></span><button class="btn btn-primary" id="k-stop">■ Stop & save</button></div>`;
  ({ m: rkMap, line: rkLine, layer: rkLayer } = drawMap('rkmap', r.track, [], false));
  if (rkMap) rkMe = L.circleMarker(Geo.last ? [Geo.last.lat, Geo.last.lng] : (HW.CENTROIDS[r.region_code] || [20, 79]), { radius: 8, color: '#fff', weight: 3, fillColor: '#2b6cb0', fillOpacity: 1 }).addTo(rkMap);
  rkMap?.on('dragstart', () => (rkMap.hwUserPanned = true));
  paintRkList(); paintRkStats(); rkTimer = setInterval(paintRkStats, 1000);
  $('k-log').onclick = () => logRoadkill();
  $('k-notes').onchange = (e) => { const r = RK(); r.notes = e.target.value; saveRk(r); };
  $('k-discard').onclick = () => { if (confirm('Discard this survey and all its records?')) { localStorage.removeItem('hw_rk'); Geo.stop(onRkFix); renderRoadkill(); } };
  $('k-stop').onclick = async () => {
    const r = RK(), km = U.trackKm(r.track);
    if (!confirm(`Finish survey?\n${km.toFixed(2)} km · ${r.records.length} records`)) return;
    const { records, ...sv } = r;
    localStorage.removeItem('hw_rk'); Geo.stop(onRkFix);
    await queue('survey', { ...sv, ended_at: new Date().toISOString(), distance_km: +km.toFixed(2), records: records.map((x) => ({ ...x, region_code: r.region_code })) });
    toast('Survey saved'); renderRoadkill();
  };
}
function paintRkStats() {
  const r = RK(); if (!r || !$('ks-time')) return;
  const sec = Math.floor((Date.now() - new Date(r.started_at)) / 1000), km = U.trackKm(r.track), n = r.records.reduce((s, x) => s + x.count, 0);
  $('ks-time').textContent = `${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}`;
  $('ks-km').textContent = km.toFixed(2); $('ks-n').textContent = n; $('ks-rate').textContent = km > 0.1 ? ((n / km) * 100).toFixed(1) : '—';
}
function paintRkList() {
  const r = RK(); if (!r) return;
  rkLayer?.clearLayers();
  if (rkLayer) r.records.forEach((x) => L.circleMarker([x.lat, x.lng], { radius: 7, color: '#fff', weight: 2, fillColor: packOf(x.pack).color, fillOpacity: 1 }).bindPopup(esc(byId(x.species_id)?.common || x.species_text || packOf(x.pack).name)).addTo(rkLayer));
  $('k-list').innerHTML = r.records.length ? r.records.slice().reverse().map((x) => `<div class="rec-row"><span style="font-size:22px">${packOf(x.pack).emoji}</span><div class="grow"><b>${esc(byId(x.species_id)?.common || x.species_text || 'Unidentified ' + packOf(x.pack).name.toLowerCase())}</b> ×${x.count}
      <div class="tiny muted">${new Date(x.observed_at).toLocaleTimeString()} · ${esc(x.condition)} · ${x.lat.toFixed(5)}, ${x.lng.toFixed(5)}</div></div><button class="btn btn-ghost btn-sm" data-delrk="${x.id}">✕</button></div>`).join('')
    : '<div class="empty small">No records yet. Tap “Road-kill here” at each carcass.</div>';
  $('k-list').querySelectorAll('[data-delrk]').forEach((b) => (b.onclick = () => { const r = RK(); r.records = r.records.filter((x) => x.id !== b.dataset.delrk); saveRk(r); paintRkList(); paintRkStats(); }));
}
async function logRoadkill(presetPack, presetSpecies) {
  const f = Geo.last && Date.now() - Geo.last.t < 30000 ? Geo.last : await Geo.once();
  const pos = f ? { lat: f.lat, lng: f.lng, acc: f.acc } : rkMap ? { ...rkMap.getCenter(), acc: null } : null;
  if (!pos) return toast('No location — wait for GPS');
  let pack = presetPack || S.packs[0]?.id, cond = 'fresh', side = '';
  const r = RK(), cl = new Set(U.lsGet('hw_cl_' + r.region_code, null) || S.checklist);
  const draw = () => {
    const sp = S.index.filter((s) => s.pack === pack && cl.has(s.id)).sort((a, b) => a.common.localeCompare(b.common));
    openSheet(`<h3>Road-kill record</h3><p class="tiny muted">📍 ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)} ${pos.acc ? '(±' + Math.round(pos.acc) + ' m)' : '(map centre — no GPS)'}</p>
      <label class="f">Group *</label><div class="chips">${S.packs.map((p) => `<button class="chip ${p.id === pack ? 'on' : ''}" data-kp="${p.id}">${p.emoji} ${esc(p.name)}</button>`).join('')}</div>
      <label class="f">Species</label><select id="kr-sp"><option value="">Unidentified ${esc(packOf(pack).name.toLowerCase())}</option>${sp.map((s) => `<option value="${s.id}" ${s.id === presetSpecies ? 'selected' : ''}>${esc(s.common)} (${esc(s.sci)})</option>`).join('')}<option value="__other">Other (type name)…</option></select>
      <input id="kr-txt" class="hidden" placeholder="Species name" style="margin-top:6px">
      <div class="grid2"><div><label class="f">Count</label><input id="kr-n" type="number" min="1" value="1"></div>
      <div><label class="f">Position on road</label><select id="kr-side">${['', 'left lane', 'right lane', 'centre', 'verge / shoulder'].map((v) => `<option ${v === side ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
      <label class="f">Carcass condition</label><div class="chips">${['fresh', 'flattened', 'decomposed', 'dried'].map((c) => `<button class="chip ${c === cond ? 'on' : ''}" data-kc="${c}">${c}</button>`).join('')}</div>
      <label class="f">Photo</label><input id="kr-ph" type="file" accept="image/*" capture="environment">
      <label class="f">Notes</label><input id="kr-notes" placeholder="Optional">
      <button class="btn btn-red btn-block" id="kr-save" style="margin-top:12px">Save record</button>`);
    $('sheetbody').querySelectorAll('[data-kp]').forEach((b) => (b.onclick = () => { pack = b.dataset.kp; presetSpecies = null; draw(); }));
    $('sheetbody').querySelectorAll('[data-kc]').forEach((b) => (b.onclick = () => { cond = b.dataset.kc; $('sheetbody').querySelectorAll('[data-kc]').forEach((x) => x.classList.toggle('on', x === b)); }));
    $('kr-sp').onchange = (e) => $('kr-txt').classList.toggle('hidden', e.target.value !== '__other');
    $('kr-side').onchange = (e) => (side = e.target.value);
    $('kr-save').onclick = async () => {
      const v = $('kr-sp').value, photos = [];
      if ($('kr-ph').files[0]) { try { photos.push(await U.processPhoto($('kr-ph').files[0])); } catch (e) { toast('Photo failed: ' + e.message); } }
      const r = RK();
      r.records.push({ id: U.uid(), species_id: v && v !== '__other' ? v : null, species_text: v === '__other' ? $('kr-txt').value.trim() : '', pack, count: Math.max(1, +$('kr-n').value || 1),
        lat: pos.lat, lng: pos.lng, accuracy_m: pos.acc, observed_at: new Date().toISOString(), condition: cond, side, notes: $('kr-notes').value, photos });
      saveRk(r); closeSheet(); paintRkList(); paintRkStats(); toast('Road-kill logged');
    };
  };
  draw();
}
